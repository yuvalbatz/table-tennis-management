<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>League - Table Tennis Ranking</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h1>🏓 Table Tennis</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="players.html" class="nav-link">Players</a></li>
                <li><a href="hth.html" class="nav-link">HTH</a></li>
                <li><a href="competitions.html" class="nav-link">Competitions</a></li>
                <li><a href="league.html" class="nav-link active">League</a></li>
                <li><button id="personalDetailsBtn" class="btn-personal">Personal Details</button></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="page-header">
                <h1>League Standings</h1>
            </div>

            <div id="loadingSpinner" class="loading-spinner"></div>
            <div id="leagueTableContainer" class="league-table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Position</th>
                            <th>Club Name</th>
                            <th>League Points</th>
                            <th>Players</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="leagueTableBody">
                    </tbody>
                </table>
            </div>

            <div id="clubPlayersModal" class="modal">
                <div class="modal-content">
                    <span class="close-modal">&times;</span>
                    <h2 id="clubPlayersTitle">Club Players</h2>
                    <div id="clubPlayersList" class="club-players-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script src="js/league.js"></script>
</body>
</html>
